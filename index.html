<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Gianella ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #0e0608;
      --bg2:     #140a0d;
      --rose:    #c9796a;
      --rose-lt: #e8a89c;
      --wine:    #7a2535;
      --gold:    #c9a96e;
      --cream:   #f5ede6;
      --ink:     #f0ddd5;
      --muted:   rgba(240,200,185,.38);
    }

    body {
      font-family: 'Josefin Sans', sans-serif;
      min-height: 100vh;
      background: radial-gradient(ellipse at 30% 20%, #1e0a10 0%, #0e0608 50%, #080308 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px 80px;
      color: var(--ink);
      overflow-x: hidden;
      position: relative;
    }

    #sky {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-9px); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15%       { transform: scale(1.35); }
      30%       { transform: scale(1); }
      45%       { transform: scale(1.18); }
    }
    @keyframes shimmerRose {
      0%   { background-position: -300% center; }
      100% { background-position: 300% center; }
    }
    @keyframes shootingStar {
      0%   { transform: translateX(0) translateY(0); opacity: 1; }
      100% { transform: translateX(240px) translateY(90px); opacity: 0; }
    }
    @keyframes pulseRing {
      0%   { transform: scale(1);   opacity: .5; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes envIn {
      from { opacity: 0; transform: scale(.7) translateY(40px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes lidOpen {
      from { transform: rotateX(0deg); }
      to   { transform: rotateX(-180deg); }
    }
    @keyframes letterRise {
      from { transform: translateX(-50%) translateY(0);     opacity: 0; }
      to   { transform: translateX(-50%) translateY(-90px); opacity: 1; }
    }
    @keyframes envOut {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.1) translateY(-30px); }
    }
    @keyframes heartFloat {
      0%   { transform: translateY(0) scale(1);   opacity: 1; }
      100% { transform: translateY(-65px) scale(1.4); opacity: 0; }
    }
    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes petalDrift {
      0%   { transform: translateY(0) translateX(0) rotate(0deg);   opacity: .7; }
      100% { transform: translateY(100vh) translateX(60px) rotate(380deg); opacity: 0; }
    }

    /* ── Hero ── */
    .hero {
      position: relative; z-index: 1;
      text-align: center; margin-bottom: 56px;
      animation: fadeUp .9s ease both;
    }
    .hero-heart {
      font-size: 48px; display: block; margin-bottom: 18px;
      animation: heartbeat 2.2s ease-in-out infinite;
      position: relative; filter: drop-shadow(0 0 18px rgba(201,121,106,.5));
    }
    .hero-heart::after {
      content: "";
      position: absolute; inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(201,121,106,.3);
      animation: pulseRing 2s ease-out infinite;
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 7vw, 4.4rem);
      font-weight: 300; font-style: italic;
      letter-spacing: .5px; line-height: 1.1;
      background: linear-gradient(100deg,
        #d4958a 0%, var(--rose-lt) 25%, var(--gold) 50%, var(--rose-lt) 75%, #d4958a 100%);
      background-size: 300% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmerRose 5s linear infinite;
    }
    .hero-sub {
      margin-top: 14px;
      font-size: 10px; font-weight: 400;
      color: var(--muted); letter-spacing: 3.5px; text-transform: uppercase;
    }
    .hero-divider {
      margin: 20px auto 0;
      display: flex; align-items: center; gap: 12px;
      width: fit-content;
    }
    .hero-divider::before, .hero-divider::after {
      content: ''; display: block; width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,169,110,.4));
    }
    .hero-divider::after { transform: scaleX(-1); }
    .hero-divider span {
      font-size: 11px; color: rgba(201,169,110,.5); letter-spacing: 2px;
    }

    /* ── Grid ── */
    .grid {
      display: flex; flex-wrap: wrap; gap: 26px;
      justify-content: center; width: 100%; max-width: 980px;
      position: relative; z-index: 1;
    }

    /* ── Card ── */
    .card {
      width: 272px; cursor: pointer; text-align: center;
      position: relative;
      animation: fadeUp .8s ease both;
    }
    .card:nth-child(2) { animation-delay: .12s; }
    .card:nth-child(3) { animation-delay: .24s; }
    .card:nth-child(4) { animation-delay: .36s; }

    .card-inner {
      background: rgba(201,121,106,.04);
      border: 1px solid rgba(201,121,106,.15);
      border-radius: 20px;
      padding: 38px 24px 30px;
      backdrop-filter: blur(14px);
      transition: transform .35s ease, box-shadow .35s ease, background .35s ease, border-color .35s ease;
      position: relative; overflow: hidden;
    }
    .card-inner::before {
      content: "";
      position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
      width: 140px; height: 140px; border-radius: 50%;
      background: radial-gradient(circle, rgba(201,121,106,.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .card-inner::after {
      content: "";
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,169,110,.25), transparent);
    }
    .card:hover .card-inner {
      transform: translateY(-10px) scale(1.02);
      background: rgba(201,121,106,.09);
      border-color: rgba(201,121,106,.38);
      box-shadow:
        0 24px 56px rgba(100,20,30,.45),
        0 0 0 1px rgba(201,121,106,.12),
        inset 0 1px 0 rgba(255,210,195,.06);
    }

    .card-emoji {
      font-size: 2.5rem; display: block; margin-bottom: 14px;
      animation: float 4.5s ease-in-out infinite;
      filter: drop-shadow(0 0 10px rgba(201,121,106,.3));
    }
    .card:nth-child(2) .card-emoji { animation-delay: .7s; }
    .card:nth-child(3) .card-emoji { animation-delay: 1.4s; }
    .card:nth-child(4) .card-emoji { animation-delay: 2.1s; }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.45rem; font-weight: 400; font-style: italic;
      color: var(--rose-lt); margin-bottom: 9px; letter-spacing: .3px;
    }
    .card-desc {
      font-size: 10.5px; color: var(--muted);
      line-height: 1.7; font-weight: 300; letter-spacing: .5px;
    }
    .card-date {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 18px;
      background: rgba(201,121,106,.07);
      border: 1px solid rgba(201,121,106,.18);
      border-radius: 99px; padding: 5px 14px;
      font-size: 9px; font-weight: 600; letter-spacing: 1.5px;
      color: rgba(201,169,110,.6); text-transform: uppercase;
    }
    .card-date::before { content: "✦"; font-size: 7px; }

    /* ── Footer ── */
    .footer {
      margin-top: 60px; position: relative; z-index: 1;
      font-size: 10px; font-weight: 300;
      color: rgba(240,200,185,.2);
      letter-spacing: 2.5px; text-transform: uppercase;
      animation: fadeUp 1s ease .5s both;
    }

    /* ── Envelope overlay ── */
    .env-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(8,2,4,.9);
      z-index: 150; justify-content: center; align-items: center;
      backdrop-filter: blur(10px);
    }
    .env-overlay.active {
      display: flex;
      animation: overlayIn .3s ease both;
    }

    .envelope-wrap {
      position: relative;
      animation: envIn .5s cubic-bezier(.22,.68,0,1.2) both;
    }

    .envelope {
      width: 300px; height: 200px;
      position: relative;
    }

    .env-body {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #2a0d14 0%, #180810 100%);
      border: 1px solid rgba(201,121,106,.25);
      border-radius: 4px 4px 8px 8px;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(201,121,106,.08), 0 0 60px rgba(122,37,53,.15);
    }
    .env-body::before {
      content: "";
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-bottom: 100px solid rgba(201,121,106,.07);
    }
    .env-body::after {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(135deg, rgba(201,121,106,.05) 0%, transparent 50%),
        linear-gradient(225deg, rgba(201,121,106,.05) 0%, transparent 50%);
    }

    .env-seal {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: 38px; height: 38px; border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #c9796a, #7a2535);
      border: 1.5px solid rgba(201,121,106,.5);
      display: grid; place-items: center;
      font-size: 15px; z-index: 2;
      box-shadow: 0 2px 16px rgba(122,37,53,.6);
      transition: opacity .3s ease;
    }

    .env-lid {
      position: absolute; top: 0; left: 0; right: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 110px solid #250c12;
      transform-origin: top center;
      transform-style: preserve-3d;
      z-index: 3;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.5));
    }

    .envelope.open .env-lid {
      animation: lidOpen .6s cubic-bezier(.4,0,.2,1) .1s both;
    }
    .envelope.open .env-seal {
      opacity: 0;
      transition: opacity .2s ease .1s;
    }

    .env-letter {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%) translateY(0);
      width: 200px; height: 130px;
      background: linear-gradient(160deg, #fdf4ef 0%, #f5e8e0 100%);
      border-radius: 4px;
      z-index: 1;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 7px;
      box-shadow: 0 -4px 24px rgba(122,37,53,.2);
      opacity: 0;
    }
    .env-letter-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; font-weight: 600; font-style: italic;
      color: #5a1a24;
      letter-spacing: .5px; text-align: center; padding: 0 16px;
    }
    .env-letter-line {
      width: 80%; height: 1px;
      background: rgba(122,37,53,.15);
      border-radius: 2px;
    }
    .env-letter-sub {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 9px; color: rgba(90,26,36,.45);
      letter-spacing: 2px; text-transform: uppercase;
    }

    .envelope.open .env-letter {
      animation: letterRise .65s cubic-bezier(.22,.68,0,1.2) .5s both;
    }

    .env-heart {
      position: absolute; font-size: 18px; pointer-events: none;
      animation: heartFloat .95s ease-out both;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(5,1,3,.9);
      z-index: 200; justify-content: center; align-items: center;
      padding: 20px; backdrop-filter: blur(8px);
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: linear-gradient(160deg, #160709 0%, #0c0406 100%);
      border: 1px solid rgba(201,121,106,.18);
      border-radius: 20px; width: 100%; max-width: 980px;
      height: 88vh; display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.8), 0 0 0 1px rgba(201,121,106,.07);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid rgba(201,121,106,.1);
      background: rgba(255,255,255,.015);
      flex-shrink: 0;
    }
    .modal-header span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem; font-style: italic;
      color: var(--rose-lt); font-weight: 400;
    }
    .modal-close {
      background: rgba(201,121,106,.08); border: 1px solid rgba(201,121,106,.2);
      color: rgba(201,121,106,.6); font-size: 1rem; cursor: pointer;
      width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center;
      transition: background .2s, color .2s;
    }
    .modal-close:hover { background: rgba(201,121,106,.22); color: var(--rose-lt); }
    .modal iframe { flex: 1; border: none; width: 100%; }

    /* ── Shooting star ── */
    .shooting { position: fixed; pointer-events: none; z-index: 0; }
    .shooting::after {
      content: "";
      position: absolute;
      width: 70px; height: 1px;
      background: linear-gradient(90deg, rgba(232,168,156,.9), transparent);
      border-radius: 2px;
      animation: shootingStar 1.1s ease-out both;
    }

    /* ── Petals ── */
    .petal {
      position: fixed; pointer-events: none; z-index: 0;
      font-size: 12px;
      animation: petalDrift linear both;
    }

    @media (max-width: 640px) {
      .card { width: 100%; max-width: 320px; }
      .hero h1 { font-size: 2.4rem; }
      .envelope { width: 260px; height: 174px; }
      .env-lid { border-left-width: 130px; border-right-width: 130px; border-top-width: 95px; }
      .env-body::before { border-left-width: 130px; border-right-width: 130px; border-bottom-width: 87px; }
    }
  </style>
</head>
<body>

  <canvas id="sky"></canvas>

  <!-- Hero -->
  <div class="hero">
    <span class="hero-heart">❤️</span>
    <h1>Para Gianella</h1>
    <p class="hero-sub">cada ventana es una sorpresa para ti</p>
    <div class="hero-divider"><span>✦</span></div>
  </div>

  <!-- Cards -->
  <div class="grid" id="grid"></div>

  <p class="footer">Para ti gordita</p>

  <!-- Envelope overlay -->
  <div class="env-overlay" id="envOverlay">
    <div class="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="env-body"></div>
        <div class="env-letter">
          <div class="env-letter-title" id="envLetterTitle"></div>
          <div class="env-letter-line"></div>
          <div class="env-letter-sub">para ti ♡</div>
        </div>
        <div class="env-lid"></div>
        <div class="env-seal">♡</div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span id="modalTitle"></span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <iframe id="modalFrame" src=""></iframe>
    </div>
  </div>

  <script>
    const repos = [
      {
        name: "mirame",
        title: "Mírame",
        emoji: "🤍",
        desc: "Un momento para ti, solo para ti",
        date: "14 de febrero",
        url: "https://ricardojpj.github.io/mirame/"
      },
      {
        name: "primermes",
        title: "Nuestro Primer Año",
        emoji: "🌸",
        desc: "El comienzo de algo muy especial",
        date: "Nuestro aniversario",
        url: "https://ricardojpj.github.io/primermes/"
      },
      {
        name: "tauro",
        title: "Mi hermosa Tauro",
        emoji: "🌙",
        desc: "Un poema para ti, mi gordita hermosa ♉❤️",
        date: "Para siempre",
        url: "tauro.html"
      },
      {
        name: "aniversario14",
        title: "Mi amor, mi orgullo, mi vida",
        emoji: "❤️",
        desc: "1 año y 2 meses",
        date: "14 meses juntos",
        url: "aniversario14.html"
      }
    ];

    const grid = document.getElementById('grid');
    repos.forEach(repo => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-inner">
          <span class="card-emoji">${repo.emoji}</span>
          <div class="card-title">${repo.title}</div>
          <div class="card-desc">${repo.desc}</div>
          <div class="card-date">${repo.date}</div>
        </div>
      `;
      card.addEventListener('click', () => startEnvelope(repo.title, repo.url));
      grid.appendChild(card);
    });

    /* ── Envelope ── */
    let pendingUrl = '', pendingTitle = '';

    function spawnHeart(container) {
      const hearts = ['❤️','🌸','💕','🌷','✨'];
      const h = document.createElement('div');
      h.className = 'env-heart';
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = (Math.random() * 240 + 30) + 'px';
      h.style.bottom = '60px';
      h.style.animationDelay = (Math.random() * .4) + 's';
      container.appendChild(h);
      setTimeout(() => h.remove(), 1200);
    }

    function startEnvelope(title, url) {
      pendingUrl = url; pendingTitle = title;
      const overlay     = document.getElementById('envOverlay');
      const envelope    = document.getElementById('envelope');
      const letterTitle = document.getElementById('envLetterTitle');
      letterTitle.textContent = title;
      envelope.classList.remove('open');
      overlay.classList.add('active');
      setTimeout(() => {
        envelope.classList.add('open');
        const wrap = document.querySelector('.envelope-wrap');
        for (let i = 0; i < 6; i++) setTimeout(() => spawnHeart(wrap), i * 150 + 500);
      }, 500);
      setTimeout(() => {
        overlay.style.animation = 'envOut .35s ease both';
        setTimeout(() => {
          overlay.classList.remove('active');
          overlay.style.animation = '';
          openModal(title, url);
        }, 350);
      }, 1500);
    }

    function openModal(title, url) {
      document.getElementById('modalTitle').textContent = title;
      const frame = document.getElementById('modalFrame');
      frame.src = url;
      document.getElementById('modalOverlay').classList.add('active');
      frame.onload = () => { try { frame.contentWindow.postMessage('play', '*'); } catch(e) {} };
    }

    function closeModal() {
      const frame = document.getElementById('modalFrame');
      try { frame.contentWindow.postMessage('pause', '*'); } catch(e) {}
      document.getElementById('modalOverlay').classList.remove('active');
      frame.src = '';
    }

    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* ── Canvas — partículas cálidas ── */
    const sky = document.getElementById('sky');
    const ctx = sky.getContext('2d');
    sky.width = window.innerWidth;
    sky.height = window.innerHeight;
    window.addEventListener('resize', () => { sky.width = window.innerWidth; sky.height = window.innerHeight; });

    const particles = [];
    // estrellas suaves rosadas
    for (let i = 0; i < 220; i++) {
      particles.push({
        x: Math.random() * sky.width,
        y: Math.random() * sky.height,
        r: Math.random() * 1.2 + 0.2,
        op: Math.random() * 0.5 + 0.15,
        phase: Math.random() * Math.PI * 2,
        ts: Math.random() * 0.025 + 0.006,
        dx: (Math.random() - 0.5) * 0.1,
        dy: (Math.random() - 0.5) * 0.06,
        warm: Math.random() > .4,
      });
    }
    // estrellas brillantes
    for (let i = 0; i < 28; i++) {
      particles.push({
        x: Math.random() * sky.width,
        y: Math.random() * sky.height,
        r: Math.random() * 1.8 + 1,
        op: Math.random() * 0.55 + 0.45,
        phase: Math.random() * Math.PI * 2,
        ts: Math.random() * 0.018 + 0.005,
        dx: (Math.random() - 0.5) * 0.07,
        dy: (Math.random() - 0.5) * 0.05,
        bright: true,
      });
    }

    let t = 0;
    function draw() {
      ctx.clearRect(0, 0, sky.width, sky.height);
      t++;

      // nebulosa rosa-vino
      const nx = Math.sin(t * 0.0018) * 60;
      const ny = Math.cos(t * 0.0013) * 40;
      const n1 = ctx.createRadialGradient(sky.width*.28+nx, sky.height*.22+ny, 0, sky.width*.28+nx, sky.height*.22+ny, sky.width*.32);
      n1.addColorStop(0, 'rgba(180,60,80,.1)');
      n1.addColorStop(1, 'transparent');
      ctx.fillStyle = n1; ctx.fillRect(0,0,sky.width,sky.height);

      const n2 = ctx.createRadialGradient(sky.width*.72-nx, sky.height*.65-ny, 0, sky.width*.72-nx, sky.height*.65-ny, sky.width*.22);
      n2.addColorStop(0, 'rgba(201,121,106,.07)');
      n2.addColorStop(1, 'transparent');
      ctx.fillStyle = n2; ctx.fillRect(0,0,sky.width,sky.height);

      particles.forEach(s => {
        s.x += s.dx; s.y += s.dy;
        if (s.x < -5) s.x = sky.width + 5;
        if (s.x > sky.width + 5) s.x = -5;
        if (s.y < -5) s.y = sky.height + 5;
        if (s.y > sky.height + 5) s.y = -5;

        const fl = (Math.sin(t * s.ts + s.phase) + 1) / 2;
        const op = s.op * (0.35 + 0.65 * fl);
        const r  = s.r  * (0.85 + 0.15 * fl);

        if (s.bright) {
          const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 5);
          g.addColorStop(0, `rgba(255,215,200,${op})`);
          g.addColorStop(0.4, `rgba(220,155,140,${op*.35})`);
          g.addColorStop(1, 'transparent');
          ctx.beginPath(); ctx.arc(s.x, s.y, r*5, 0, Math.PI*2);
          ctx.fillStyle = g; ctx.fill();
        }
        ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2);
        const warmColor = s.warm ? `rgba(255,210,190,${op})` : `rgba(240,190,185,${op})`;
        ctx.fillStyle = s.bright ? `rgba(255,225,210,${op})` : warmColor;
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }
    draw();

    /* ── Shooting stars ── */
    function shoot() {
      const el = document.createElement('div');
      el.className = 'shooting';
      el.style.top  = Math.random() * 55 + '%';
      el.style.left = Math.random() * 60 + '%';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }
    setInterval(shoot, 5000);
    setTimeout(shoot, 2000);

    /* ── Falling petals ── */
    function spawnPetal() {
      const petals = ['🌸','🌷','✿','❀'];
      const el = document.createElement('div');
      el.className = 'petal';
      el.textContent = petals[Math.floor(Math.random() * petals.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.top = '-30px';
      const dur = Math.random() * 8 + 10;
      el.style.animationDuration = dur + 's';
      el.style.opacity = Math.random() * 0.35 + 0.1;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000);
    }
    setInterval(spawnPetal, 3500);
    setTimeout(spawnPetal, 1000);
    setTimeout(spawnPetal, 2500);
  </script>
</body>
</html>
