<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Gianella ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #080b1a 0%, #0a0e22 35%, #0d1030 65%, #090c20 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px 80px;
      color: white;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Canvas estrellas ── */
    #sky {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ── Animaciones ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15%       { transform: scale(1.3); }
      30%       { transform: scale(1); }
      45%       { transform: scale(1.15); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes shootingStar {
      0%   { transform: translateX(0) translateY(0); opacity: 1; }
      100% { transform: translateX(260px) translateY(100px); opacity: 0; }
    }
    @keyframes pulseRing {
      0%   { transform: scale(1);   opacity: .4; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* ── Envelope keyframes ── */
    @keyframes envIn {
      from { opacity: 0; transform: scale(.7) translateY(40px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes lidOpen {
      from { transform: rotateX(0deg); }
      to   { transform: rotateX(-180deg); }
    }
    @keyframes letterRise {
      from { transform: translateX(-50%) translateY(0);   opacity: 0; }
      to   { transform: translateX(-50%) translateY(-90px); opacity: 1; }
    }
    @keyframes envOut {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(1.1) translateY(-30px); }
    }
    @keyframes heartFloat {
      0%   { transform: translateY(0) scale(1);   opacity: 1; }
      100% { transform: translateY(-60px) scale(1.4); opacity: 0; }
    }
    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Hero ── */
    .hero {
      position: relative; z-index: 1;
      text-align: center; margin-bottom: 64px;
      animation: fadeUp .8s ease both;
    }
    .hero-heart {
      font-size: 44px; display: block; margin-bottom: 16px;
      animation: heartbeat 2s ease-in-out infinite;
      position: relative;
    }
    .hero-heart::after {
      content: "";
      position: absolute; inset: -8px;
      border-radius: 50%;
      border: 1.5px solid rgba(180,200,255,.25);
      animation: pulseRing 1.8s ease-out infinite;
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 600; letter-spacing: -.5px; line-height: 1.1;
      background: linear-gradient(90deg, #c8d8f5 0%, #b0b8e8 35%, #d4c8f0 65%, #e0d0f8 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }
    .hero-sub {
      margin-top: 12px; font-size: 13px; font-weight: 500;
      color: rgba(200,215,255,.35); letter-spacing: 2px; text-transform: uppercase;
    }

    /* ── Grid ── */
    .grid {
      display: flex; flex-wrap: wrap; gap: 28px;
      justify-content: center; width: 100%; max-width: 960px;
      position: relative; z-index: 1;
    }

    /* ── Card ── */
    .card {
      width: 280px; cursor: pointer; text-align: center;
      position: relative;
      animation: fadeUp .7s ease both;
    }
    .card:nth-child(2) { animation-delay: .1s; }
    .card:nth-child(3) { animation-delay: .2s; }

    .card-inner {
      background: rgba(180,200,255,.04);
      border: 1px solid rgba(180,200,255,.14);
      border-radius: 24px;
      padding: 36px 24px 28px;
      backdrop-filter: blur(12px);
      transition: transform .3s ease, box-shadow .3s ease, background .3s ease, border-color .3s ease;
      position: relative; overflow: hidden;
    }
    .card-inner::before {
      content: "";
      position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 120px; border-radius: 50%;
      background: radial-gradient(circle, rgba(150,170,255,.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .card:hover .card-inner {
      transform: translateY(-10px) scale(1.02);
      background: rgba(180,200,255,.08);
      border-color: rgba(180,200,255,.32);
      box-shadow:
        0 20px 50px rgba(80,100,200,.2),
        0 0 0 1px rgba(180,200,255,.12),
        inset 0 1px 0 rgba(220,230,255,.08);
    }

    .card-emoji {
      font-size: 2.6rem; display: block; margin-bottom: 14px;
      animation: float 4s ease-in-out infinite;
    }
    .card:nth-child(2) .card-emoji { animation-delay: .6s; }
    .card:nth-child(3) .card-emoji { animation-delay: 1.2s; }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 600;
      color: #c8d8f8; margin-bottom: 8px; letter-spacing: .2px;
    }
    .card-desc {
      font-size: 11.5px; color: rgba(200,215,255,.38);
      line-height: 1.65; font-weight: 500;
    }
    .card-date {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 18px;
      background: rgba(180,200,255,.06);
      border: 1px solid rgba(180,200,255,.14);
      border-radius: 99px; padding: 4px 12px;
      font-size: 10px; font-weight: 700; letter-spacing: .8px;
      color: rgba(200,215,255,.5); text-transform: uppercase;
    }
    .card-date::before { content: "✦"; font-size: 8px; }

    .card::after {
      content: "";
      position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
      width: 60%; height: 30px;
      background: radial-gradient(ellipse, rgba(200,140,80,.25) 0%, transparent 70%);
      opacity: 0; transition: opacity .3s ease;
      pointer-events: none;
    }
    .card:hover::after { opacity: 1; }

    /* ── Footer ── */
    .footer {
      margin-top: 64px; position: relative; z-index: 1;
      font-size: 11px; color: rgba(255,255,255,.18);
      letter-spacing: 1.5px; text-transform: uppercase;
      animation: fadeUp 1s ease .4s both;
    }

    /* ── Envelope overlay ── */
    .env-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(4,3,14,.85);
      z-index: 150; justify-content: center; align-items: center;
      backdrop-filter: blur(8px);
    }
    .env-overlay.active {
      display: flex;
      animation: overlayIn .3s ease both;
    }

    /* ── Envelope ── */
    .envelope-wrap {
      position: relative;
      animation: envIn .45s cubic-bezier(.22,.68,0,1.2) both;
    }

    .envelope {
      width: 300px; height: 200px;
      position: relative;
    }

    /* Body of envelope */
    .env-body {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #1a1a40 0%, #12122e 100%);
      border: 1px solid rgba(180,200,255,.2);
      border-radius: 4px 4px 8px 8px;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(180,200,255,.08);
    }

    /* Bottom V-fold */
    .env-body::before {
      content: "";
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-bottom: 100px solid rgba(150,170,255,.07);
    }

    /* Side folds */
    .env-body::after {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(135deg, rgba(180,200,255,.06) 0%, transparent 50%),
        linear-gradient(225deg, rgba(180,200,255,.06) 0%, transparent 50%);
    }

    /* Wax seal */
    .env-seal {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: 36px; height: 36px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #9060d0, #5020a0);
      border: 1.5px solid rgba(200,160,255,.4);
      display: grid; place-items: center;
      font-size: 14px; z-index: 2;
      box-shadow: 0 2px 12px rgba(100,50,200,.5);
      transition: opacity .3s ease;
    }

    /* Lid */
    .env-lid {
      position: absolute; top: 0; left: 0; right: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 110px solid #1e1e4a;
      transform-origin: top center;
      transform-style: preserve-3d;
      z-index: 3;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.4));
    }
    .env-lid::after {
      content: "";
      position: absolute;
      top: -110px; left: -150px; right: -150px;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 110px solid rgba(180,200,255,.04);
    }

    /* Lid open state */
    .envelope.open .env-lid {
      animation: lidOpen .6s cubic-bezier(.4,0,.2,1) .1s both;
    }
    .envelope.open .env-seal {
      opacity: 0;
      transition: opacity .2s ease .1s;
    }

    /* Letter inside */
    .env-letter {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%) translateY(0);
      width: 200px; height: 130px;
      background: linear-gradient(160deg, #f0eeff 0%, #e8e4ff 100%);
      border-radius: 4px;
      z-index: 1;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 6px;
      box-shadow: 0 -4px 20px rgba(120,100,200,.2);
      opacity: 0;
    }
    .env-letter-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; font-weight: 600; color: #3a2880;
      letter-spacing: .5px; text-align: center; padding: 0 16px;
    }
    .env-letter-line {
      width: 80%; height: 1px;
      background: rgba(100,80,200,.15);
      border-radius: 2px;
    }
    .env-letter-sub {
      font-size: 9px; color: rgba(80,60,160,.5);
      letter-spacing: 1.5px; text-transform: uppercase;
    }

    .envelope.open .env-letter {
      animation: letterRise .6s cubic-bezier(.22,.68,0,1.2) .5s both;
    }

    /* Floating hearts */
    .env-heart {
      position: absolute; font-size: 18px; pointer-events: none;
      animation: heartFloat .9s ease-out both;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(5,2,10,.88);
      z-index: 200; justify-content: center; align-items: center;
      padding: 20px; backdrop-filter: blur(6px);
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: linear-gradient(160deg, #130818 0%, #0a0412 100%);
      border: 1px solid rgba(249,197,209,.15);
      border-radius: 20px; width: 100%; max-width: 980px;
      height: 88vh; display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(249,197,209,.06);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid rgba(249,197,209,.08);
      background: rgba(255,255,255,.02);
      flex-shrink: 0;
    }
    .modal-header span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem; color: #f9c5d1; font-weight: 600;
    }
    .modal-close {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.5); font-size: 1rem; cursor: pointer;
      width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center;
      transition: background .2s, color .2s;
    }
    .modal-close:hover { background: rgba(249,197,209,.15); color: #f9c5d1; }
    .modal iframe { flex: 1; border: none; width: 100%; }

    /* ── Shooting star ── */
    .shooting { position: fixed; pointer-events: none; z-index: 0; }
    .shooting::after {
      content: "";
      position: absolute;
      width: 80px; height: 1.5px;
      background: linear-gradient(90deg, rgba(200,215,255,.9), transparent);
      border-radius: 2px;
      animation: shootingStar 1.1s ease-out both;
    }

    @media (max-width: 640px) {
      .card { width: 100%; max-width: 320px; }
      .hero h1 { font-size: 2.2rem; }
      .envelope { width: 260px; height: 174px; }
      .env-lid {
        border-left-width: 130px; border-right-width: 130px; border-top-width: 95px;
      }
      .env-body::before {
        border-left-width: 130px; border-right-width: 130px; border-bottom-width: 87px;
      }
    }
  </style>
</head>
<body>

  <canvas id="sky"></canvas>

  <!-- Hero -->
  <div class="hero">
    <span class="hero-heart">❤️</span>
    <h1>Para Gianella</h1>
    <p class="hero-sub">cada ventana es una sorpresa para ti</p>
  </div>

  <!-- Cards -->
  <div class="grid" id="grid"></div>

  <p class="footer">Para ti gordita</p>

  <!-- Envelope animation overlay -->
  <div class="env-overlay" id="envOverlay">
    <div class="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="env-body"></div>
        <div class="env-letter">
          <div class="env-letter-title" id="envLetterTitle"></div>
          <div class="env-letter-line"></div>
          <div class="env-letter-sub">para ti ♡</div>
        </div>
        <div class="env-lid"></div>
        <div class="env-seal">♡</div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span id="modalTitle"></span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <iframe id="modalFrame" src=""></iframe>
    </div>
  </div>

  <script>
    const repos = [
      {
        name: "mirame",
        title: "Mírame",
        emoji: "🤍",
        desc: "Un momento para ti, solo para ti",
        date: "14 de febrero",
        url: "https://ricardojpj.github.io/mirame/"
      },
      {
        name: "primermes",
        title: "Nuestro Primer Año",
        emoji: "🌸",
        desc: "El comienzo de algo muy especial",
        date: "Nuestro aniversario",
        url: "https://ricardojpj.github.io/primermes/"
      },
      {
        name: "tauro",
        title: "Mi hermosa Tauro",
        emoji: "🌙",
        desc: "Un poema para ti, mi gordita hermosa ♉❤️",
        date: "Para siempre",
        url: "tauro.html"
      },
      {
        name: "aniversario14",
        title: "Mi amor, mi orgullo, mi vida",
        emoji: "❤️",
        desc: "1 año y 2 meses · Tu primera cirugía · Qué orgullo tan inmenso es amarte",
        date: "14 meses juntos",
        url: "aniversario14.html"
      }
    ];

    const grid = document.getElementById('grid');
    repos.forEach(repo => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-inner">
          <span class="card-emoji">${repo.emoji}</span>
          <div class="card-title">${repo.title}</div>
          <div class="card-desc">${repo.desc}</div>
          <div class="card-date">${repo.date}</div>
        </div>
      `;
      card.addEventListener('click', () => startEnvelope(repo.title, repo.url));
      grid.appendChild(card);
    });

    /* ── Envelope animation ── */
    let pendingUrl = '';
    let pendingTitle = '';

    function spawnHeart(container) {
      const h = document.createElement('div');
      h.className = 'env-heart';
      h.textContent = ['❤️','💜','🤍','💙'][Math.floor(Math.random()*4)];
      h.style.left = (Math.random() * 240 + 30) + 'px';
      h.style.bottom = '60px';
      h.style.animationDelay = (Math.random() * .4) + 's';
      container.appendChild(h);
      setTimeout(() => h.remove(), 1200);
    }

    function startEnvelope(title, url) {
      pendingUrl  = url;
      pendingTitle = title;

      const overlay   = document.getElementById('envOverlay');
      const envelope  = document.getElementById('envelope');
      const letterTitle = document.getElementById('envLetterTitle');

      letterTitle.textContent = title;

      // Reset state
      envelope.classList.remove('open');
      overlay.classList.add('active');

      // Phase 1 — envelope appears (0–450ms), then lid opens (500ms)
      setTimeout(() => {
        envelope.classList.add('open');

        // Spawn hearts while letter rises
        const wrap = document.querySelector('.envelope-wrap');
        for (let i = 0; i < 5; i++) {
          setTimeout(() => spawnHeart(wrap), i * 160 + 500);
        }
      }, 500);

      // Phase 2 — after letter has risen, fade out and open modal (1.4s total)
      setTimeout(() => {
        overlay.style.animation = 'envOut .35s ease both';
        setTimeout(() => {
          overlay.classList.remove('active');
          overlay.style.animation = '';
          openModal(title, url);
        }, 350);
      }, 1500);
    }

    function openModal(title, url) {
      document.getElementById('modalTitle').textContent = title;
      const frame = document.getElementById('modalFrame');
      frame.src = url;
      document.getElementById('modalOverlay').classList.add('active');
      frame.onload = () => {
        try { frame.contentWindow.postMessage('play', '*'); } catch(e) {}
      };
    }

    function closeModal() {
      const frame = document.getElementById('modalFrame');
      try { frame.contentWindow.postMessage('pause', '*'); } catch(e) {}
      document.getElementById('modalOverlay').classList.remove('active');
      frame.src = '';
    }

    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    /* ── Canvas estrellas ── */
    const sky = document.getElementById('sky');
    const ctx = sky.getContext('2d');
    sky.width = window.innerWidth;
    sky.height = window.innerHeight;
    window.addEventListener('resize', () => {
      sky.width = window.innerWidth;
      sky.height = window.innerHeight;
    });

    const stars = [];
    for (let i = 0; i < 260; i++) {
      stars.push({
        x: Math.random() * sky.width,
        y: Math.random() * sky.height,
        r: Math.random() * 1.3 + 0.2,
        op: Math.random() * 0.6 + 0.2,
        phase: Math.random() * Math.PI * 2,
        ts: Math.random() * 0.03 + 0.008,
        dx: (Math.random() - 0.5) * 0.12,
        dy: (Math.random() - 0.5) * 0.07,
      });
    }
    for (let i = 0; i < 35; i++) {
      stars.push({
        x: Math.random() * sky.width,
        y: Math.random() * sky.height,
        r: Math.random() * 2 + 1,
        op: Math.random() * 0.5 + 0.5,
        phase: Math.random() * Math.PI * 2,
        ts: Math.random() * 0.02 + 0.005,
        dx: (Math.random() - 0.5) * 0.08,
        dy: (Math.random() - 0.5) * 0.05,
        bright: true,
      });
    }

    let t = 0;
    function draw() {
      ctx.clearRect(0, 0, sky.width, sky.height);
      t++;

      // Nebulosa animada
      const nx = Math.sin(t * 0.002) * 50;
      const ny = Math.cos(t * 0.0015) * 35;
      const n1 = ctx.createRadialGradient(sky.width*.3+nx, sky.height*.25+ny, 0, sky.width*.3+nx, sky.height*.25+ny, sky.width*.3);
      n1.addColorStop(0, 'rgba(160,80,60,.08)');
      n1.addColorStop(1, 'transparent');
      ctx.fillStyle = n1; ctx.fillRect(0,0,sky.width,sky.height);

      const n2 = ctx.createRadialGradient(sky.width*.75-nx, sky.height*.6-ny, 0, sky.width*.75-nx, sky.height*.6-ny, sky.width*.25);
      n2.addColorStop(0, 'rgba(120,60,40,.06)');
      n2.addColorStop(1, 'transparent');
      ctx.fillStyle = n2; ctx.fillRect(0,0,sky.width,sky.height);

      stars.forEach(s => {
        s.x += s.dx; s.y += s.dy;
        if (s.x < -5) s.x = sky.width + 5;
        if (s.x > sky.width + 5) s.x = -5;
        if (s.y < -5) s.y = sky.height + 5;
        if (s.y > sky.height + 5) s.y = -5;

        const fl = (Math.sin(t * s.ts + s.phase) + 1) / 2;
        const op = s.op * (0.4 + 0.6 * fl);
        const r  = s.r * (0.85 + 0.15 * fl);

        if (s.bright) {
          const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 4);
          g.addColorStop(0, `rgba(255,220,230,${op})`);
          g.addColorStop(0.4, `rgba(240,180,210,${op*.3})`);
          g.addColorStop(1, 'transparent');
          ctx.beginPath(); ctx.arc(s.x, s.y, r*4, 0, Math.PI*2);
          ctx.fillStyle = g; ctx.fill();
        }
        ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2);
        ctx.fillStyle = s.bright ? `rgba(255,240,210,${op})` : `rgba(240,225,200,${op})`;
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }
    draw();

    /* ── Shooting stars ── */
    function shoot() {
      const el = document.createElement('div');
      el.className = 'shooting';
      el.style.top  = Math.random() * 50 + '%';
      el.style.left = Math.random() * 65 + '%';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }
    setInterval(shoot, 4000);
    setTimeout(shoot, 1500);
  </script>
</body>
</html>
